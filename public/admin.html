<!doctype html>
<html lang="zh-Hant" data-theme="watch365">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <meta name="robots" content="noindex,nofollow">
  <title>幫你盯盤・後台</title>
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/admin.css">
</head>
<body class="adm-body">
  <header class="adm-topbar">
    <span class="adm-brand">幫你盯盤 <small>後台</small></span>
    <div class="adm-tools" id="adminTools" hidden>
      <label class="adm-period">期間
        <select id="periodSelect" aria-label="統計期間">
          <option value="7">7 天</option>
          <option value="30">30 天</option>
          <option value="90">90 天</option>
        </select>
      </label>
      <button type="button" class="adm-secondary" id="refreshButton">重新整理</button>
    </div>
  </header>
  <main id="admin" class="adm-shell"></main>
  <script type="module" src="/admin.js"></script>
</body>
</html>
