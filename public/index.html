      <p class="proto-lead">設好日 K 技術指標條件，系統每天收盤前幫你檢查台股上市、上櫃股票，條件成立就用 LINE 通知你，不用整天盯著看盤軟體。</p>

        <li>範圍：自選股票，或直接用條件從今日監控名單（有成交量的股票）找股票。</li>
        <li>回測：建立前先看過去幾個交易日哪些股票符合條件。</li>
        <li>通知：綁定 LINE 官方帳號，條件成立時推播到手機。</li>
      </ul>
