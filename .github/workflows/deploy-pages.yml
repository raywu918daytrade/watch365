name: Deploy watch365 static prototype

on:
  push:
    branches: [main]
    paths:
      - "public/ui-prototype.html"
      - "public/ui-prototype.css"
      - "public/ui-prototype.js"
      - "public/styles.css"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Prepare static prototype
        run: |
          mkdir -p _site
          cp public/ui-prototype.html _site/index.html
          cp public/ui-prototype.css public/ui-prototype.js public/styles.css _site/
          sed -i 's|href="/|href="./|g; s|src="/|src="./|g' _site/index.html
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
